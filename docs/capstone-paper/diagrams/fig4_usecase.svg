ke="#000" stroke-width="2.5"/><text x="600" y="1142.97" font-size="23" text-anchor="middle" dominant-baseline="central"   fill="#000">Solve the daily</text><text x="600" y="1171.03" font-size="23" text-anchor="middle" dominant-baseline="central"   fill="#000">newspaper puzzle</text><ellipse cx="600" cy="1270" rx="230" ry="44" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="600" y="1270" font-size="23" text-anchor="middle" dominant-baseline="central"   fill="#000">Change settings</text><circle cx="130" cy="630" r="26" fill="#fff" stroke="#000" stroke-width="3"/><line x1="130" y1="656" x2="130" y2="730" stroke="#000" stroke-width="3"/><line x1="85" y1="685" x2="175" y2="685" stroke="#000" stroke-width="3"/><line x1="130" y1="730" x2="95" y2="795" stroke="#000" stroke-width="3"/><line x1="130" y1="730" x2="165" y2="795" stroke="#000" stroke-width="3"/><text x="130" y="830" font-size="30" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">Player</text><path d="M830 592 H900 V479 H834" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#ao)"/><text x="908" y="535.5" font-size="21" text-anchor="start" dominant-baseline="central"  font-style="italic" fill="#000">«extend»</text><path d="M830 818 H900 V479 H834" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#ao)"/><text x="908" y="648.5" font-size="21" text-anchor="start" dominant-baseline="central"  font-style="italic" fill="#000">«extend»</text><path d="M830 253 H900 V140 H834" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#ao)"/><text x="908" y="196.5" font-size="21" text-anchor="start" dominant-baseline="central"  font-style="italic" fill="#000">«include»</text><path d="M1420 1065 L1315 890" fill="none" stroke="#000" stroke-width="2"  /><path d="M1420 1065 L1315 1020" fill="none" stroke="#000" stroke-width="2"  /><path d="M1420 1065 L1315 1150" fill="none" stroke="#000" stroke-width=