lots</text><path d="M1035 422 H1067 V404 L1097 440 L1067 476 V458 H1035 Z" fill="#000"/><rect x="1110" y="40" width="440" height="800" rx="22" fill="#fff" stroke="#000" stroke-width="4"/><path d="M1110 140 V62 Q1110 40 1132 40 H1528 Q1550 40 1550 62 V140 Z" fill="#000"/><text x="1330" y="90" font-size="46" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#fff">OUTPUT</text><text x="1330" y="402.15999999999997" font-size="36" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">AkeanQuest:</text><text x="1330" y="446.08" font-size="36" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">An Android-Based 2D</text><text x="1330" y="490" font-size="36" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">Role-Playing Game</text><text x="1330" y="533.92" font-size="36" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">for Learning Standard</text><text x="1330" y="577.8399999999999" font-size="36" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">Akeanon Vocabulary</text><path d="M1330 840 L1330 915 L270 915 L270 844" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ah)"/><rect x="500" y="893" width="600" height="44" fill="#fff"/><text x="800" y="915" font-size="28" text-anchor="middle" dominant-baseline="central"  font-style="italic" fill="#000">Feedback from playtesting and evaluation</text></svg>