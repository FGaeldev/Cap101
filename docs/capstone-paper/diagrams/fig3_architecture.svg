<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" style="font-family:'Times New Roman',Times,serif"><rect width="1600" height="1240" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#000" stroke-width="1.5"/></marker></defs><rect x="560" y="20" width="480" height="90" rx="45" fill="#fff" stroke="#000" stroke-width="2.5" /><text x="800" y="49.14" font-size="26" text-anchor="middle" dominant-baseline="central"   fill="#000">Player</text><text x="800" y="80.86" font-size="26" text-anchor="middle" dominant-baseline="central"   fill="#000">(Android smartphone: touch screen)</text><path d="M760 110 L760 160" fill="none" stroke="#000" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M840 160 L840 112" fill="none" stroke="#000" stroke-width="2.5"  marker-end="url(#ah)"/><text x="700" y="135" font-size="22" text-anchor="end" dominant-baseline="central"  font-style="italic" fill="#000">touch input</text><text x="900" y="135" font-size="22" text-anchor="start" dominant-baseline="central"  font-style="italic" fill="#000">screen and sound</text><rect x="60" y="162" width="1480" height="290" rx="14" fill="#fff" stroke="#000" stroke-width="3" /><rect x="60" y="162" width="1480" height="46" rx="14" fill="#000"/><rect x="60" y="192" width="1480" height="16" fill="#000"/><text x="800" y="185" font-size="28" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#fff">PRESENTATION LAYER (Godot scenes and UI)</text><rect x="82" y="226" width="464" height="95" rx="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="314" y="258.86" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">Main menu and</text><text x="31