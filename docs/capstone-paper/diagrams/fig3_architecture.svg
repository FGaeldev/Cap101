th="1480" height="16" fill="#000"/><text x="800" y="901" font-size="28" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#fff">DATA LAYER</text><rect x="82" y="942" width="464" height="138" rx="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="314" y="981.72" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">Game content (JSON): word bank,</text><text x="314" y="1011" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">dialogue, quests, cutscenes,</text><text x="314" y="1040.28" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">chapters, culture spots</text><rect x="568" y="942" width="464" height="138" rx="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="800" y="981.72" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">Assets: sprites, tilesets,</text><text x="800" y="1011" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">portraits, music,</text><text x="800" y="1040.28" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">sound effects</text><rect x="1054" y="942" width="464" height="138" rx="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="1286" y="981.72" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">Local device storage:</text><text x="1286" y="1011" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">three save slots with backup,</text><text x="1286" y="1040.28" font-size="24" text-anchor="middle" dominant-baseline="central"   fill="#000">settings file</text><rect x="60" y="1130" width="1480" height="80" rx="10" fill="#e6e6e6" stroke="#000" stroke-width="2.5" /><text x="800" y="1170" font-size="27" text-anchor="middle" dominant-baseline="central" font-weight="bold"  fill="#000">Godot Engine 4.7 (GL Compatibility renderer)  ·  Android, 64-bit (arm64-v8a)  ·  offline, no server</text></svg>