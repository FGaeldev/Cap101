<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -64 50 90" width="700" height="1260" font-family="sans-serif">
  <!-- MERGED DRAFT v2: teammate's layout (water-floor mangroves, winding boardwalk, mid island, T-deck)
       on the repo's coordinates. 1 unit = 1 tile (16px). Rows 0..24 already exist; rows -1..-60 are new. -->
  <defs>
    <pattern id="g" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#000" stroke-opacity=".12" stroke-width=".04"/></pattern>
    <pattern id="wat" width="4" height="2" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#3a78b0"/><path d="M.3 .6h1.2M2.3 1.5h1.2" stroke="#5d9bd1" stroke-width=".18"/></pattern>
    <g id="tr"><circle r="1" fill="#2f7a3a" stroke="#1d4d24" stroke-width=".12"/></g>
  </defs>
  <rect x="-4" y="-64" width="50" height="90" fill="#1b1b1b"/>
  <text x="20.5" y="-62" font-size="1.1" fill="#fff" text-anchor="middle">Bakhawan Eco-Park — outdoor draft v2 (merged with teammate layout)</text>

  <!-- whole new area = tidal water (collision) -->
  <rect x="-1" y="-60" width="43" height="56" fill="url(#wat)"/>
  <text x="3" y="-58.3" font-size=".9" fill="#fff">open bay (Kalibo) — sea tiles</text>

  <!-- fishpond dikes, lower east (from teammate) -->
  <g fill="#57b87a">
    <rect x="25" y="-20" width="16" height="1"/><rect x="25" y="-20" width="1" height="16"/><rect x="40" y="-20" width="1" height="16"/>
    <rect x="29" y="-17" width="1" height="13"/><rect x="33" y="-17" width="1" height="13"/><rect x="37" y="-17" width="1" height="13"/>
    <rect x="25" y="-12" width="16" height="1"/>
  </g>
  <text x="33" y="-21" font-size=".7" fill="#fff" text-anchor="middle">fishpond dikes (grass, walkable for NPC only)</text>

  <!-- shore band: land fringe rows -4..-1 -->
  <rect x="-1" y="-4" width="43" height="4" fill="#57c49a"/>
  <path d="M-1 -4 Q4 -4.8 9 -4 T19 -4 T29 -4 T42 -4" fill="none" stroke="#7a6849" stroke-width=".5"/>
  <text x="1" y="-1.2" font-size=".65" fill="#123">mud bank edge</text>

  <!-- mid island (rest area) -->
  <rect x="21" y="-42" width="18" height="7" fill="#57c49a" stroke="#7a6849" stroke-width=".3"/>
  <rect x="34" y="-42" width="4" height="4" fill="#9a7440" stroke="#3a2810" stroke-width=".2"/>
  <text x="36" y="-39.8" font-size=".55" fill="#fff" text-anchor="middle">watch-</text><text x="36" y="-39.1" font-size=".55" fill="#fff" text-anchor="middle">tower</text>
  <g fill="#c9a060" stroke="#5a3d1e" stroke-width=".15"><rect x="22" y="-41" width="3" height="3"/><rect x="26" y="-41" width="3" height="3"/></g>
  <text x="25.5" y="-36" font-size=".6" text-anchor="middle" fill="#123">picnic huts · rest island</text>

  <!-- sand spit + cottages, west of the T-deck -->
  <path d="M8 -57 H20 V-49 H11 Q8 -51 8 -54 Z" fill="#e7d39a" stroke="#fff" stroke-width=".2"/>
  <g fill="#b98a4a" stroke="#5a3d1e" stroke-width=".15"><rect x="9" y="-56" width="4" height="3"/><rect x="14" y="-56" width="4" height="3"/></g>
  <text x="14" y="-50.4" font-size=".6" text-anchor="middle" fill="#3a2810">sand spit · cottages</text>
  <!-- clam stakes -->
  <g fill="#4b3520"><rect x="3" y="-47" width=".25" height=".8"/><rect x="5" y="-46" width=".25" height=".8"/><rect x="4" y="-44" width=".25" height=".8"/><rect x="6" y="-48" width=".25" height=".8"/></g>
  <text x="5" y="-42.6" font-size=".6" fill="#fff" text-anchor="middle">clam stakes</text>

  <!-- trees lining the boardwalk (sprites, in water) -->
  <g>
    <!-- along first stretch -->
    <use href="#tr" x="22.5" y="-2"/><use href="#tr" x="17.5" y="-6"/><use href="#tr" x="22.5" y="-8"/><use href="#tr" x="11" y="-8"/>
    <use href="#tr" x="17" y="-10"/><use href="#tr" x="17" y="-13"/><use href="#tr" x="9" y="-16"/><use href="#tr" x="3" y="-10"/><use href="#tr" x="5" y="-14"/><use href="#tr" x="2" y="-6"/>
    <!-- staircase -->
    <use href="#tr" x="13" y="-21"/><use href="#tr" x="15" y="-24"/><use href="#tr" x="18" y="-27"/><use href="#tr" x="21" y="-30"/><use href="#tr" x="20" y="-18"/><use href="#tr" x="23" y="-22"/>
    <use href="#tr" x="26" y="-25"/><use href="#tr" x="8" y="-22"/><use href="#tr" x="6" y="-27"/><use href="#tr" x="10" y="-30"/><use href="#tr" x="14" y="-33"/><use href="#tr" x="4" y="-33"/>
    <!-- east run -->
    <use href="#tr" x="28" y="-24"/><use href="#tr" x="31" y="-31"/><use href="#tr" x="34" y="-24"/><use href="#tr" x="37" y="-31"/><use href="#tr" x="38" y="-25"/><use href="#tr" x="40" y="-29"/>
    <!-- north stretch -->
    <use href="#tr" x="27" y="-45"/><use href="#tr" x="27" y="-48"/><use href="#tr" x="33" y="-45"/><use href="#tr" x="33" y="-48"/><use href="#tr" x="24" y="-46"/><use href="#tr" x="36" y="-46"/><use href="#tr" x="39" y="-48"/><use href="#tr" x="22" y="-49"/>
    <use href="#tr" x="9" y="-38"/><use href="#tr" x="4" y="-40"/><use href="#tr" x="14" y="-41"/><use href="#tr" x="40" y="-36"/><use href="#tr" x="17" y="-45"/>
  </g>
  <text x="2" y="-35" font-size=".65" fill="#e7f5e0">mangroves in water (Bakhawan_tree sprites)</text>

  <!-- EXISTING AREA rows 0..24 -->
  <rect x="-1" y="0" width="43" height="25" fill="#57c49a"/>
  <rect x="-1" y="13" width="43" height="12" fill="#b9c3c8"/>
  <path d="M1 18H40V22H8V25H3V18Z" fill="#706a78"/>
  <path d="M21 9H40V18H21Z" fill="#706a78" opacity=".55"/>
  <rect x="7.5" y="7" width="10" height="7.5" fill="#8a6a2a" stroke="#333" stroke-width=".15"/>
  <text x="12.5" y="10.6" font-size=".8" fill="#fff" text-anchor="middle">VISITOR CENTER</text>
  <text x="12.5" y="11.7" font-size=".6" fill="#fff" text-anchor="middle">(existing)</text>
  <rect x="14.5" y="13.5" width="2" height="1" fill="#e04848"/>
  <text x="15.5" y="16.2" font-size=".6" text-anchor="middle" fill="#222">door → indoor (existing warp 15,14)</text>
  <rect x="0" y="2" width="6" height="8" fill="#7fb45c" stroke="#3b6b2a" stroke-width=".15"/>
  <g fill="#3b2a1a"><rect x=".6" y="3" width="4.8" height=".6"/><rect x=".6" y="4.6" width="4.8" height=".6"/><rect x=".6" y="6.2" width="4.8" height=".6"/><rect x=".6" y="7.8" width="4.8" height=".6"/></g>
  <text x="3" y="11" font-size=".65" text-anchor="middle">nursery</text>
  <rect x="24" y="2" width="6" height="4" fill="#d58f5a" stroke="#333" stroke-width=".15"/><text x="27" y="4.3" font-size=".65" text-anchor="middle">canteen</text>
  <rect x="32" y="2" width="6" height="4" fill="#c86fa0" stroke="#333" stroke-width=".15"/><text x="35" y="4.3" font-size=".65" text-anchor="middle">souvenir</text>
  <rect x="18" y="4" width="4" height="1" fill="#b98a4a" stroke="#5a3d1e" stroke-width=".15"/>
  <text x="20" y="3.6" font-size=".6" text-anchor="middle">bamboo gate</text>

  <!-- BOARDWALK (2 wide): gate N → west jog → N → staircase NE → east → N to island → N → T-deck; spur W to sand spit -->
  <g fill="none" stroke="#d9b56a" stroke-width="2" stroke-linejoin="miter">
    <path d="M20 7 V-6 H14 V-18 H16 V-20 H18 V-22 H20 V-24 H22 V-26 H24 V-28 H31 V-35"/>
    <path d="M30 -42 V-53"/>
    <path d="M21 -54 H39"/>
    <path d="M21 -54 H19"/>
  </g>
  <!-- S2 platform -->
  <rect x="9" y="-15" width="4" height="4" fill="#d9b56a" stroke="#7a5a2a" stroke-width=".15"/>
  <!-- T-deck rails (teammate's magenta edge pieces) -->
  <path d="M20 -55.2 H40 V-52.8 H31.2 M28.8 -52.8 H20" fill="none" stroke="#7a5a2a" stroke-width=".25"/>

  <!-- story markers -->
  <g font-size=".7" font-weight="bold">
    <circle cx="20" cy="5.5" r=".7" fill="#ffd400" stroke="#000" stroke-width=".1"/><text x="21" y="6.6" fill="#000">S1 Ambo at gate</text>
    <circle cx="11" cy="-13" r=".7" fill="#ffd400" stroke="#000" stroke-width=".1"/><text x="3" y="-17.4" fill="#fff">S2 roots lesson</text>
    <circle cx="38" cy="-54" r=".7" fill="#ffd400" stroke="#000" stroke-width=".1"/><text x="39" y="-56" fill="#fff" text-anchor="middle">S3 fishing</text>
    <circle cx="23" cy="-54" r=".7" fill="#ffd400" stroke="#000" stroke-width=".1"/><text x="24" y="-56" fill="#fff">S4 vocab</text>
    <circle cx="16" cy="-52" r=".7" fill="#ffd400" stroke="#000" stroke-width=".1"/><text x="16" y="-48.6" fill="#3a2810" text-anchor="middle" font-size=".6">S5 family</text>
  </g>
  <g font-size=".6" fill="#000">
    <circle cx="4.5" cy="22.5" r=".5" fill="#e04848"/><text x="5.3" y="24.4">warp to park (existing)</text>
    <circle cx="6.5" cy="19.5" r=".4" fill="#3070ff"/><text x="7.2" y="19.8">Trip/Rose</text>
  </g>

  <rect x="-1" y="-60" width="43" height="85" fill="url(#g)"/>
  <line x1="-1.5" y1="0" x2="42.5" y2="0" stroke="#fff" stroke-width=".12" stroke-dasharray=".5 .3"/>
  <g font-size=".6" fill="#fff" text-anchor="end"><text x="-1.6" y=".3">y0</text><text x="-1.6" y="-19.7">-20</text><text x="-1.6" y="-39.7">-40</text><text x="-1.6" y="-59.7">-60</text><text x="-1.6" y="24.7">24</text></g>
</svg>
